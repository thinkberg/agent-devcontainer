# Per-project settings for dcc (sourced as shell).
# NAME drives all object names (PROJECTNAME-dev, PROJECTNAME-net,
# PROJECTNAME-db, PROJECTNAME-pgdata) — keep it in sync with the literal
# names in devcontainer.json (dcc init seeded both from the same value).
NAME=PROJECTNAME

# Bridge subnet for the container (+ optional database sidecar). Must be
# unique per concurrently-running project and must match DEVCONTAINER_SUBNET
# in devcontainer.json (the firewall allows exactly this range). dcc init
# picks the first 172.30.N.0/24 no podman network on the host uses.
SUBNET=172.30.0.0/24

# Database sidecar (optional). Empty DB_IMAGE = no database (default).
# It initializes ONCE, on an empty PROJECTNAME-pgdata volume, from
# .devcontainer/db-init.d/* (mounted into /docker-entrypoint-initdb.d);
# wipe deliberately with `dcc db reset`. In-container address:
# postgres:5432; host-side (IDE database views): 127.0.0.1:$DB_PORT.
#DB_IMAGE=docker.io/postgres:16
#DB_PORT=5433
#DB_ENV="POSTGRES_USER=postgres POSTGRES_PASSWORD=postgres"   # space-separated VAR=value, no spaces in values
